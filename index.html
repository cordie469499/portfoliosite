<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Bodoni Moda", serif;
      background:#fafafa;
      color:#111;
    }

    /* --- NAV --- */
    header {
      border-top:1px solid #111;
      border-bottom:1px solid #111;
      padding:10px 18px;
    }

    nav {
      max-width:1080px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo { font-size:22px; letter-spacing:1px; }

    .menu {
      list-style:none;
      display:flex;
      gap:22px;
      margin:0;
      padding:0;
      font-size:14px;
    }

    .menu a {
      text-decoration:none;
      color:#111;
    }

    .menu a:hover { opacity:.65; }

    /* --- HERO --- */
    .hero {
      max-width:1080px;
      margin:40px auto 60px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .hero img {
      width:100%;
      height:360px;
      object-fit:cover;
      border-radius:14px;
    }

    /* --- SECTION --- */
    section {
      max-width:860px;
      margin:0 auto 80px;
      padding:0 16px;
      line-height:1.75;
    }

    h2 { font-size:18px; letter-spacing:.05em; margin:0 0 12px; }

    footer {
      border-top:1px solid #111;
      padding:14px 18px 24px;
      text-align:center;
      font-size:12px;
      color:#666;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Portfolio</div>
      <ul class="menu">
        <li><a href="#works">WORKS</a></li>
        <li><a href="#profile">PROFILE</a></li>
        <li><a href="#contact">CONTACT</a></li>
      </ul>
    </nav>
  </header>

  <!-- ここは photo フォルダを使わず、直接画像URLを指定 -->
  <div class="hero">
    <img src="https://picsum.photos/id/1011/900/600" alt="visual 1" />
    <img src="https://picsum.photos/id/1025/900/600" alt="visual 2" />
    <img src="https://picsum.photos/id/1035/900/600" alt="visual 3" />
    <img src="https://picsum.photos/id/1041/900/600" alt="visual 4" />
  </div>

  <section id="works">
    <h2>WORKS</h2>
    <p>ここに制作実績の説明テキストが入ります。各プロジェクトの意図や役割、成果を短くまとめていきます。</p>
  </section>

  <section id="profile">
    <h2>PROFILE</h2>
    <p>自己紹介や経歴、得意分野などを記載します。シンプルに、読みやすく。</p>
  </section>

  <section id="contact">
    <h2>CONTACT</h2>
    <p>お問い合わせ先（メール・SNS など）を記載してください。</p>
  </section>

  <footer>
    © Portfolio — All Rights Reserved
  </footer>
</body>
</html>
