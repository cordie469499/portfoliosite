<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CORDIE;</title>

<style>
  body {margin:0;font-family:Arial, Helvetica, sans-serif;background:#0a0a0a;color:#fff;}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:14px 18px;background:#0a0a0a;z-index:10;}
  header h1{margin:0;font-size:18px;letter-spacing:.15em}
  nav a{color:#fff;margin-left:18px;text-decoration:none;font-size:14px}
  main{padding-top:70px}

  .page{display:none;min-height:70vh;padding:24px}
  .page.active{display:block}

  .title{font-size:26px;margin-bottom:8px}
  .desc{opacity:.75;margin-bottom:16px}

  .portfolio-thumbs{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
  }
  .portfolio-thumbs img{
    width:100%;height:160px;object-fit:cover;cursor:pointer;border-radius:12px;
  }

  .hero-video iframe{
    width:100%;
    max-width:900px;
    height:50vw;
    max-height:480px;
    border-radius:16px;
    border:0;
    display:block;
  }

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.9);
    display:none;align-items:center;justify-content:center;z-index:100}
  .modal.open{display:flex}
  .modal-content{max-width:92%;max-height:88%;position:relative}
  .modal img,.modal iframe{max-width:100%;max-height:100%;border:0;border-radius:14px}
  .close-btn{position:absolute;top:-14px;right:-8px;font-size:32px;cursor:pointer}
</style>
</head>

<body>
<header>
  <h1>CORDIE;</h1>
  <nav>
    <a href="#" data-target="home">Home</a>
    <a href="#" data-target="portfolio">Portfolio</a>
  </nav>
</header>

<main>

  <!-- HOME -->
  <section class="page active" id="page-home">
    <h2 class="title">Home</h2>
    <p>ようこそ。ここでは制作した映像・作品をまとめています。</p>

    <div class="hero-video">
      <iframe
        src="https://www.youtube.com/embed/9W7SKpAJ6B0?autoplay=1&mute=1&playsinline=1&loop=1&playlist=9W7SKpAJ6B0&rel=0"
        allow="autoplay; encrypted-media"
        allowfullscreen
      ></iframe>
    </div>
  </section>

  <!-- PORTFOLIO (Images + YouTube in one gallery) -->
  <section class="page" id="page-portfolio">
    <h2 class="title">Portfolio</h2>
    <p class="desc">サムネイルをクリックすると拡大・再生されます。</p>

    <div class="portfolio-thumbs" id="thumbContainer">
      <img src="11111.png"  data-type="image" data-src="11111.png">
      <img src="22222.png"  data-type="image" data-src="22222.png">
      <img src="112233.png" data-type="image" data-src="112233.png">
      <img src="5DE.JPG"    data-type="image" data-src="5DE.JPG">
      <img src="E12.JPG"    data-type="image" data-src="E12.JPG">
      <img src="enter1.png" data-type="image" data-src="enter1.png">
      <img src="F96.JPG"    data-type="image" data-src="F96.JPG">
      <img src="insta1.jpg" data-type="image" data-src="insta1.jpg">
      <img src="insta2.jpg" data-type="image" data-src="insta2.jpg">
      <img src="insta3.jpg" data-type="image" data-src="insta3.jpg">
      <img src="TOBIORI.png" data-type="image" data-src="TOBIORI.png">

      <!-- YouTube サムネ（ギャラリー内で再生） -->
      <img
        src="https://img.youtube.com/vi/9W7SKpAJ6B0/hqdefault.jpg"
        data-type="video"
        data-src="https://www.youtube.com/embed/9W7SKpAJ6B0">
    </div>
  </section>

</main>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModal">&times;</span>
    <img id="modalImg" style="display:none">
    <iframe id="modalVideo" allowfullscreen style="display:none"></iframe>
  </div>
</div>

<script>
/* ---------- NAV ---------- */
document.querySelectorAll("nav a").forEach(a=>{
  a.addEventListener("click",e=>{
    e.preventDefault();
    const t=a.dataset.target;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page-"+t).classList.add("active");
  });
});

/* ---------- GALLERY (Image + YouTube) ---------- */
const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");
const modalVideo=document.getElementById("modalVideo");
const closeBtn=document.getElementById("closeModal");

document.getElementById("thumbContainer").addEventListener("click",e=>{
  if(e.target.tagName!=="IMG") return;

  const type=e.target.dataset.type;
  const src =e.target.dataset.src;

  modal.classList.add("open");

  if(type==="image"){
    modalVideo.style.display="none";
    modalVideo.src="";
    modalImg.src=src;
    modalImg.style.display="block";
  }else if(type==="video"){
    modalImg.style.display="none";
    modalImg.src="";
    modalVideo.src=src+"?autoplay=1&rel=0&playsinline=1";
    modalVideo.style.display="block";
  }
});

function closeModal(){
  modal.classList.remove("open");
  modalImg.src="";
  modalVideo.src="";
}
closeBtn.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
</script>

</body>
</html>
